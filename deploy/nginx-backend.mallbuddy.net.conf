# /etc/nginx/sites-available/backend.mallbuddy.net
# After DNS points backend.mallbuddy.net → this VPS:
#   sudo ln -sf /etc/nginx/sites-available/backend.mallbuddy.net /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d backend.mallbuddy.net

server {
    listen 80;
    server_name backend.mallbuddy.net;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
